name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PVERSION_NAME="${GITHUB_REF_NAME#v}" -PVERSION_CODE="${GITHUB_RUN_NUMBER}"
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "beer-diary-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/beer-diary-${{ github.ref_name }}.apk
          generate_release_notes: true
